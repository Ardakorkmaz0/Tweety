{% extends "base.html" %}
{% block content %}
<div class="container" style="max-width: 450px; margin-top: 50px;">
    <div class="card">
        <div class="card-body" style="padding: 30px; text-align: center;">
            <div style="margin-bottom: 20px;">
                <i data-lucide="check-circle" style="width: 48px; height: 48px; color: #10f28c; display: inline-block;"></i>
            </div>
            <h2 class="mb-3" style="color: #10f28c;">Password Reset Complete</h2>
            <p style="color: #aaa;">Your password has been reset successfully. You can now log in with your new password.</p>
            <a href="{% url 'login' %}" class="btn btn-primary w-100 mt-3" style="padding: 12px;">Log In</a>
        </div>
    </div>
</div>
{% endblock %}
