{% extends "base.html" %}
{% block content %}
<div class="container" style="max-width: 450px; margin-top: 50px;">
    <div class="card">
        <div class="card-body" style="padding: 30px; text-align: center;">
            <div style="margin-bottom: 20px;">
                <i data-lucide="mail-check" style="width: 48px; height: 48px; color: #10f28c; display: inline-block;"></i>
            </div>
            <h2 class="mb-3" style="color: #10f28c;">Email Sent</h2>
            <p style="color: #aaa; font-size: 14px;">
                If an account exists with that email address, a password reset link has been sent. Check your inbox.
            </p>
            <a href="{% url 'login' %}" class="btn btn-primary w-100 mt-3" style="padding: 12px;">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
