{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Lost in Space | Tweety</title>
    <link rel="icon" href="{% static 'tweetapp/favicon.png' %}" type="image/png">
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="{% static 'css/theme.css' %}">
    <script>
        const savedTheme = localStorage.getItem('tweety_theme') || 'dark';
        if (savedTheme === 'light') { document.documentElement.classList.add('light-theme'); }
    </script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: var(--deep-bg);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
        }

        .stars-container {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;
            opacity: 0;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: var(--max-opacity); transform: scale(1); }
        }

        .shooting-star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #10f28c;
            border-radius: 50%;
            box-shadow: 0 0 6px 2px rgba(16, 242, 140, 0.6),
                        -20px 0 12px rgba(16, 242, 140, 0.3),
                        -40px 0 20px rgba(16, 242, 140, 0.1);
            animation: shoot 3s ease-in-out infinite;
            opacity: 0;
        }

        .shooting-star:nth-child(2) {
            top: 20%;
            animation-delay: 1.5s;
            animation-duration: 2.5s;
        }

        .shooting-star:nth-child(3) {
            top: 60%;
            animation-delay: 3s;
            animation-duration: 4s;
        }

        @keyframes shoot {
            0% { transform: translateX(-100px) translateY(0); opacity: 0; }
            5% { opacity: 1; }
            15% { opacity: 1; }
            30% { transform: translateX(calc(100vw + 200px)) translateY(200px); opacity: 0; }
            100% { opacity: 0; }
        }

        .error-number {
            font-size: clamp(120px, 20vw, 280px);
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, #10f28c 0%, #6366f1 40%, #10f28c 60%, #6366f1 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient-shift 4s ease-in-out infinite;
            filter: drop-shadow(0 0 60px rgba(16, 242, 140, 0.3));
            user-select: none;
        }

        @keyframes gradient-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .glitch {
            position: relative;
        }

        .glitch::before,
        .glitch::after {
            content: '404';
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            font-size: inherit;
            font-weight: inherit;
            line-height: inherit;
            background: linear-gradient(135deg, #10f28c, #6366f1);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .glitch::before {
            animation: glitch-1 3s ease-in-out infinite;
            clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
        }

        .glitch::after {
            animation: glitch-2 3s ease-in-out infinite;
            clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
        }

        @keyframes glitch-1 {
            0%, 85%, 100% { transform: translateX(0); }
            88% { transform: translateX(-8px) skewX(-2deg); }
            92% { transform: translateX(6px) skewX(1deg); }
            95% { transform: translateX(-3px); }
        }

        @keyframes glitch-2 {
            0%, 80%, 100% { transform: translateX(0); }
            83% { transform: translateX(8px) skewX(2deg); }
            87% { transform: translateX(-6px) skewX(-1deg); }
            90% { transform: translateX(4px); }
        }

        .bird-container {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .bird-svg {
            filter: drop-shadow(0 0 30px rgba(16, 242, 140, 0.4));
        }

        .pulse-ring {
            position: absolute;
            border: 2px solid rgba(16, 242, 140, 0.3);
            border-radius: 50%;
            animation: pulse-expand 2s ease-out infinite;
        }

        .pulse-ring:nth-child(2) { animation-delay: 0.6s; }
        .pulse-ring:nth-child(3) { animation-delay: 1.2s; }

        @keyframes pulse-expand {
            0% { width: 80px; height: 80px; opacity: 1; }
            100% { width: 200px; height: 200px; opacity: 0; }
        }

        .home-btn {
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .home-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #10f28c, #6366f1);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .home-btn:hover::before {
            opacity: 1;
        }

        .home-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 40px rgba(16, 242, 140, 0.3);
        }

        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, transparent, rgba(16, 242, 140, 0.3), transparent);
            animation: scan 4s linear infinite;
            z-index: 5;
            pointer-events: none;
        }

        @keyframes scan {
            0% { top: -10px; }
            100% { top: 100vh; }
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            animation: particle-float linear infinite;
            pointer-events: none;
        }

        @keyframes particle-float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-20vh) rotate(720deg); opacity: 0; }
        }

        .subtitle-reveal {
            animation: reveal 1s ease-out 0.5s both;
        }

        .desc-reveal {
            animation: reveal 1s ease-out 0.8s both;
        }

        .btn-reveal {
            animation: reveal 1s ease-out 1.1s both;
        }

        @keyframes reveal {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <!-- Scanline Effect -->
    <div class="scanline"></div>

    <!-- Stars -->
    <div class="stars-container" id="stars"></div>

    <!-- Shooting Stars -->
    <div class="shooting-star" style="top: 10%; left: -100px;"></div>
    <div class="shooting-star" style="top: 30%; left: -100px;"></div>
    <div class="shooting-star" style="top: 70%; left: -100px;"></div>

    <!-- Floating Particles -->
    <div id="particles"></div>

    <!-- Ambient Glow -->
    <div class="fixed top-1/3 left-1/4 w-[500px] h-[500px] rounded-full opacity-8 pointer-events-none blur-3xl -z-0" style="background: radial-gradient(circle, rgba(16, 242, 140, 0.08), transparent 70%);"></div>
    <div class="fixed bottom-1/4 right-1/4 w-[400px] h-[400px] rounded-full opacity-8 pointer-events-none blur-3xl -z-0" style="background: radial-gradient(circle, rgba(99, 102, 241, 0.08), transparent 70%);"></div>

    <!-- Main Content -->
    <div class="relative z-10 min-h-screen flex flex-col items-center justify-center px-4">
        
        <!-- Floating Bird -->
        <div class="bird-container relative mb-8">
            <div class="pulse-ring absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>
            <div class="pulse-ring absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>
            <div class="pulse-ring absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>
            <svg class="bird-svg w-20 h-20 md:w-24 md:h-24 relative z-10" viewBox="0 0 100 100" fill="none">
                <circle cx="50" cy="50" r="40" fill="url(#birdGrad)" opacity="0.15"/>
                <path d="M30 55 C30 35, 50 20, 70 35 C75 38, 78 45, 75 52 L70 50 C72 45, 70 40, 65 38 C55 30, 40 38, 38 48 L50 52 Z" fill="url(#birdGrad)"/>
                <circle cx="58" cy="38" r="3" fill="white"/>
                <path d="M70 42 L82 38 L75 45 Z" fill="#10f28c"/>
                <defs>
                    <linearGradient id="birdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#10f28c"/>
                        <stop offset="100%" stop-color="#6366f1"/>
                    </linearGradient>
                </defs>
            </svg>
        </div>

        <!-- 404 Number -->
        <div class="error-number glitch mb-4" aria-label="404">404</div>

        <!-- Subtitle -->
        <h2 class="subtitle-reveal text-xl md:text-2xl font-bold mb-3 text-center" style="color: var(--text-primary); letter-spacing: 4px; text-transform: uppercase;">
            Lost in <span class="text-gradient">Cyberspace</span>
        </h2>

        <!-- Description -->
        <p class="desc-reveal text-center max-w-md mb-10 text-base" style="color: var(--text-muted); line-height: 1.8;">
            This page has flown away! The tweet you're looking for doesn't exist, was deleted, or maybe it never existed at all.
        </p>

        <!-- Action Buttons -->
        <div class="btn-reveal flex flex-col sm:flex-row items-center gap-4">
            <a href="{% url 'tweetapp:listtweet' %}" class="home-btn px-8 py-4 rounded-2xl font-bold text-lg decoration-transparent" style="background: var(--neon-green); color: #07070f;">
                <span class="relative z-10 flex items-center gap-3">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    Back to Home
                </span>
            </a>

            <button onclick="history.back()" class="px-8 py-4 rounded-2xl font-bold text-lg transition-all duration-300 hover:bg-[rgba(255,255,255,0.08)] cursor-pointer" style="border: 1px solid var(--border-subtle); color: var(--text-primary); background: transparent;">
                <span class="flex items-center gap-3">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                    Go Back
                </span>
            </button>
        </div>

        <!-- Tweety branding -->
        <div class="mt-16 opacity-30 flex items-center gap-2">
            <div class="w-6 h-6 rounded-lg flex items-center justify-center" style="background: var(--gradient-primary);">
                <img src="{% static 'tweetapp/favicon.png' %}" width="14" height="14" class="filter invert" style="mix-blend-mode: plus-lighter;">
            </div>
            <span class="text-sm font-semibold" style="letter-spacing: 1px;">TWEETY</span>
        </div>
    </div>

    <script>
        // Generate stars
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (2 + Math.random() * 4) + 's');
            star.style.setProperty('--max-opacity', (0.3 + Math.random() * 0.7));
            star.style.animationDelay = Math.random() * 4 + 's';
            star.style.width = star.style.height = (1 + Math.random() * 2) + 'px';
            starsContainer.appendChild(star);
        }

        // Generate floating particles
        const particlesContainer = document.getElementById('particles');
        const colors = ['#10f28c', '#6366f1', '#00d2ff', '#a78bfa'];
        for (let i = 0; i < 20; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.background = colors[Math.floor(Math.random() * colors.length)];
            p.style.animationDuration = (8 + Math.random() * 12) + 's';
            p.style.animationDelay = Math.random() * 10 + 's';
            p.style.opacity = 0.3 + Math.random() * 0.5;
            p.style.width = p.style.height = (2 + Math.random() * 4) + 'px';
            particlesContainer.appendChild(p);
        }

        // Interactive 404 tilt on mouse move
        const errorNum = document.querySelector('.error-number');
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 15;
            const y = (e.clientY / window.innerHeight - 0.5) * 15;
            errorNum.style.transform = `perspective(1000px) rotateX(${-y}deg) rotateY(${x}deg)`;
        });
    </script>
</body>
</html>
